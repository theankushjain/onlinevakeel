<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" font-family="'Segoe UI','Calibri',Arial,sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0.6 L10,5 L0,9.4 z" fill="#7d8da8"/></marker>
  <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0.6 L10,5 L0,9.4 z" fill="#b2bdd0"/></marker>
  <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0.6 L10,5 L0,9.4 z" fill="#1a8a7a"/></marker>
</defs>
<rect x="0" y="0" width="1080" height="760" fill="#ffffff"/><text x="540" y="40" font-size="25" font-weight="700" fill="#17233f" text-anchor="middle">Figure 1 — User and System Diagram</text><text x="540" y="65" font-size="14.5" fill="#5a6a85" text-anchor="middle">Who uses OnlineVakeel, what the platform does, and which outside services it may call</text><rect x="350" y="104" width="380" height="452" rx="14" fill="#fafbfe" stroke="#c9d3e4" stroke-width="1.8" stroke-dasharray="7 5"/><text x="366" y="125" font-size="12.5" font-weight="700" fill="#5a6a85" text-anchor="start">SYSTEM BOUNDARY — OnlineVakeel platform</text><rect x="372" y="134" width="336" height="86" rx="11" fill="#e5effc" stroke="#2f6fb5" stroke-width="2"/><text x="540" y="161.55" font-size="15" font-weight="700" fill="#174b80" text-anchor="middle">Web Interface</text><text x="540" y="180.05" font-size="15" font-weight="700" fill="#174b80" text-anchor="middle">Next.js 14 · TypeScript</text><text x="540" y="202.55" font-size="11.8" font-weight="400" fill="#174b80" text-anchor="middle">Citizen desk · Advocate portal · Notice print</text><rect x="372" y="240" width="336" height="92" rx="11" fill="#eae7fb" stroke="#5b49b8" stroke-width="2"/><text x="540" y="263.3" font-size="15" font-weight="700" fill="#352a7a" text-anchor="middle">Multi-Agent Engine</text><text x="540" y="281.8" font-size="15" font-weight="700" fill="#352a7a" text-anchor="middle">FastAPI · 8 steps in fixed order</text><text x="540" y="304.3" font-size="11.8" font-weight="400" fill="#352a7a" text-anchor="middle">Masking · triage · intake · retrieval</text><text x="540" y="318.8" font-size="11.8" font-weight="400" fill="#352a7a" text-anchor="middle">verification · guidance · drafting · matching</text><rect x="372" y="352" width="336" height="86" rx="11" fill="#edf0f6" stroke="#5b6b85" stroke-width="2"/><text x="540" y="381.55" font-size="15" font-weight="700" fill="#303d56" text-anchor="middle">Legal Knowledge Store</text><text x="540" y="404.05" font-size="11.8" font-weight="400" fill="#303d56" text-anchor="middle">Bare Act sections · court judgments</text><text x="540" y="418.55" font-size="11.8" font-weight="400" fill="#303d56" text-anchor="middle">754 judicial districts · advocate directory</text><rect x="372" y="458" width="336" height="68" rx="11" fill="#edf0f6" stroke="#5b6b85" stroke-width="2"/><text x="540" y="478.23" font-size="14" font-weight="700" fill="#303d56" text-anchor="middle">Case Session State</text><text x="540" y="499.73" font-size="11.8" font-weight="400" fill="#303d56" text-anchor="middle">Remembers facts across chat turns so a follow-up</text><text x="540" y="514.23" font-size="11.8" font-weight="400" fill="#303d56" text-anchor="middle">question keeps the earlier amount, date and city</text><rect x="26" y="148" width="212" height="146" rx="11" fill="#eceff5" stroke="#3d5573" stroke-width="2"/><text x="132" y="223.71" font-size="15.5" font-weight="700" fill="#1f3550" text-anchor="middle">CITIZEN</text><text x="132" y="246.71" font-size="11.8" font-weight="400" fill="#1f3550" text-anchor="middle">Any person in India with</text><text x="132" y="261.71000000000004" font-size="11.8" font-weight="400" fill="#1f3550" text-anchor="middle">a civil or criminal problem</text><text x="132" y="276.71000000000004" font-size="11.8" font-weight="400" fill="#1f3550" text-anchor="middle">No login required</text><circle cx="132" cy="168.595" r="10.45" fill="#3d5573"/><path d="M114.235,197.855 a17.764999999999997,18.287499999999998 0 0 1 35.529999999999994,0 z" fill="#3d5573"/><rect x="842" y="148" width="212" height="146" rx="11" fill="#eceff5" stroke="#3d5573" stroke-width="2"/><text x="948" y="223.71" font-size="15.5" font-weight="700" fill="#1f3550" text-anchor="middle">ADVOCATE</text><text x="948" y="246.71" font-size="11.8" font-weight="400" fill="#1f3550" text-anchor="middle">Practising lawyer with a</text><text x="948" y="261.71000000000004" font-size="11.8" font-weight="400" fill="#1f3550" text-anchor="middle">Bar Council enrolment ID</text><text x="948" y="276.71000000000004" font-size="11.8" font-weight="400" fill="#1f3550" text-anchor="middle">Logs in to the portal</text><circle cx="948" cy="168.595" r="10.45" fill="#3d5573"/><path d="M930.235,197.855 a17.764999999999997,18.287499999999998 0 0 1 35.529999999999994,0 z" fill="#3d5573"/><rect x="26" y="400" width="212" height="126" rx="11" fill="#fbe8eb" stroke="#b14256" stroke-width="2"/><text x="132" y="441.39" font-size="14.5" font-weight="700" fill="#7b2937" text-anchor="middle">PUBLIC HELPLINES</text><text x="132" y="463.39" font-size="11.8" font-weight="400" fill="#7b2937" text-anchor="middle">NALSA 15100 · Police 112</text><text x="132" y="478.39" font-size="11.8" font-weight="400" fill="#7b2937" text-anchor="middle">Cyber 1930 · Women 1091</text><text x="132" y="493.39" font-size="11.8" font-weight="400" fill="#7b2937" text-anchor="middle">Tele-Law 14430</text><line x1="238" y1="186" x2="348" y2="186" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><text x="293" y="163" font-size="11.2" font-weight="400" fill="#5a6a85" text-anchor="middle">describes problem</text><text x="293" y="176.5" font-size="11.2" font-weight="400" fill="#5a6a85" text-anchor="middle">in plain words</text><line x1="348" y1="250" x2="238" y2="250" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><text x="293" y="266" font-size="11.2" font-weight="400" fill="#5a6a85" text-anchor="middle">guidance, citations</text><text x="293" y="279.5" font-size="11.2" font-weight="400" fill="#5a6a85" text-anchor="middle">notice, advocates</text><line x1="842" y1="186" x2="732" y2="186" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><text x="787" y="163" font-size="11.2" font-weight="400" fill="#5a6a85" text-anchor="middle">registers; sees</text><text x="787" y="176.5" font-size="11.2" font-weight="400" fill="#5a6a85" text-anchor="middle">masked case leads</text><line x1="732" y1="250" x2="842" y2="250" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><text x="787" y="266" font-size="11.2" font-weight="400" fill="#5a6a85" text-anchor="middle">on Accept, client</text><text x="787" y="279.5" font-size="11.2" font-weight="400" fill="#5a6a85" text-anchor="middle">phone is revealed</text><line x1="348" y1="440" x2="238" y2="440" stroke="#b14256" stroke-width="2" marker-end="url(#ar)"/><text x="288" y="424" font-size="11.2" font-weight="400" fill="#7b2937" text-anchor="middle">emergency route</text><line x1="540" y1="556" x2="540" y2="596" stroke="#b2bdd0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/><path d="M540,596 L122,596 L122,626" fill="none" stroke="#b2bdd0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/><path d="M540,596 L1034,596 L1034,626" fill="none" stroke="#b2bdd0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/><path d="M540,596 L334,596 L334,626" fill="none" stroke="#b2bdd0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/><path d="M540,596 L746,596 L746,626" fill="none" stroke="#b2bdd0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/><line x1="540" y1="596" x2="540" y2="626" stroke="#b2bdd0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/><text x="566" y="580" font-size="11.8" font-weight="400" fill="#5a6a85" text-anchor="start" font-style="italic">every outside service is optional — see note below</text><rect x="14" y="626" width="199" height="104" rx="11" fill="#fbe8eb" stroke="#b14256" stroke-width="2"/><text x="113.5" y="656.6239999999999" font-size="13.2" font-weight="700" fill="#7b2937" text-anchor="middle">Google Gemini</text><text x="113.5" y="673.324" font-size="13.2" font-weight="700" fill="#7b2937" text-anchor="middle">cloud LLM</text><text x="113.5" y="694.024" font-size="11.2" font-weight="400" fill="#7b2937" text-anchor="middle">writes the plain-language</text><text x="113.5" y="707.524" font-size="11.2" font-weight="400" fill="#7b2937" text-anchor="middle">reply and the notice</text><rect x="227" y="626" width="199" height="104" rx="11" fill="#fbe8eb" stroke="#b14256" stroke-width="2"/><text x="326.5" y="656.6239999999999" font-size="13.2" font-weight="700" fill="#7b2937" text-anchor="middle">Qwen3-8B</text><text x="326.5" y="673.324" font-size="13.2" font-weight="700" fill="#7b2937" text-anchor="middle">IIT KGP Track-B VM</text><text x="326.5" y="694.024" font-size="11.2" font-weight="400" fill="#7b2937" text-anchor="middle">used first for Hindi,</text><text x="326.5" y="707.524" font-size="11.2" font-weight="400" fill="#7b2937" text-anchor="middle">and as LLM fallback</text><rect x="440" y="626" width="199" height="104" rx="11" fill="#fbe8eb" stroke="#b14256" stroke-width="2"/><text x="539.5" y="656.6239999999999" font-size="13.2" font-weight="700" fill="#7b2937" text-anchor="middle">BGE Embeddings</text><text x="539.5" y="673.324" font-size="13.2" font-weight="700" fill="#7b2937" text-anchor="middle">vector service</text><text x="539.5" y="694.024" font-size="11.2" font-weight="400" fill="#7b2937" text-anchor="middle">optional meaning-based</text><text x="539.5" y="707.524" font-size="11.2" font-weight="400" fill="#7b2937" text-anchor="middle">search over sections</text><rect x="653" y="626" width="199" height="104" rx="11" fill="#fbe8eb" stroke="#b14256" stroke-width="2"/><text x="752.5" y="656.6239999999999" font-size="13.2" font-weight="700" fill="#7b2937" text-anchor="middle">Supabase</text><text x="752.5" y="673.324" font-size="13.2" font-weight="700" fill="#7b2937" text-anchor="middle">PostgreSQL + pgvector</text><text x="752.5" y="694.024" font-size="11.2" font-weight="400" fill="#7b2937" text-anchor="middle">optional cloud store for a</text><text x="752.5" y="707.524" font-size="11.2" font-weight="400" fill="#7b2937" text-anchor="middle">larger legal corpus</text><rect x="866" y="626" width="199" height="104" rx="11" fill="#fbe8eb" stroke="#b14256" stroke-width="2"/><text x="965.5" y="656.6239999999999" font-size="13.2" font-weight="700" fill="#7b2937" text-anchor="middle">AWS Open Data</text><text x="965.5" y="673.324" font-size="13.2" font-weight="700" fill="#7b2937" text-anchor="middle">public S3 buckets</text><text x="965.5" y="694.024" font-size="11.2" font-weight="400" fill="#7b2937" text-anchor="middle">Supreme Court and High</text><text x="965.5" y="707.524" font-size="11.2" font-weight="400" fill="#7b2937" text-anchor="middle">Court judgment PDFs</text><text x="540" y="748" font-size="12" font-weight="400" fill="#5a6a85" text-anchor="middle" font-style="italic">If no key or database is configured the platform still answers in full, using its built-in legal corpus and written-out legal templates (zero-config mode).</text></svg>