<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="872" viewBox="0 0 1080 872" font-family="'Segoe UI','Calibri',Arial,sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0.6 L10,5 L0,9.4 z" fill="#7d8da8"/></marker>
  <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0.6 L10,5 L0,9.4 z" fill="#b2bdd0"/></marker>
  <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0.6 L10,5 L0,9.4 z" fill="#1a8a7a"/></marker>
</defs>
<rect x="0" y="0" width="1080" height="872" fill="#ffffff"/><text x="540" y="40" font-size="25" font-weight="700" fill="#17233f" text-anchor="middle">Figure 4 — Methodology and Measurement Block Diagram</text><text x="540" y="65" font-size="14.5" fill="#5a6a85" text-anchor="middle">Each stage of the method has a fixed way of being tested and a number that can be reported to the panel</text><rect x="14" y="92" width="246" height="38" rx="9" fill="#eae7fb" stroke="#5b49b8" stroke-width="2"/><text x="137" y="113.25" font-size="12.5" font-weight="700" fill="#352a7a" text-anchor="middle">STAGE — what the method does</text><rect x="280" y="92" width="352" height="38" rx="9" fill="#e4f3f0" stroke="#1a8a7a" stroke-width="2"/><text x="456" y="113.25" font-size="12.5" font-weight="700" fill="#0e544a" text-anchor="middle">INSTRUMENT — how we test it</text><rect x="652" y="92" width="414" height="38" rx="9" fill="#fff7e0" stroke="#b08512" stroke-width="2"/><text x="859" y="113.25" font-size="12.5" font-weight="700" fill="#7a5a0c" text-anchor="middle">MEASUREMENT — what we report</text><rect x="14" y="144" width="246" height="96" rx="11" fill="#e4f3f0" stroke="#1a8a7a" stroke-width="2"/><text x="137" y="186.39" font-size="14.5" font-weight="700" fill="#0e544a" text-anchor="middle">Privacy masking</text><text x="137" y="208.39" font-size="11.4" font-weight="400" fill="#0e544a" text-anchor="middle">PIIRedactor</text><circle cx="32" cy="161" r="11" fill="#1a8a7a"/><text x="32" y="165.2" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><rect x="280" y="144" width="352" height="96" rx="11" fill="#edf0f6" stroke="#5b6b85" stroke-width="2"/><text x="456" y="181.39" font-size="11.6" font-weight="400" fill="#303d56" text-anchor="middle">Send a probe set of made-up Aadhaar, PAN,</text><text x="456" y="196.39" font-size="11.6" font-weight="400" fill="#303d56" text-anchor="middle">phone and e-mail strings through the API</text><text x="456" y="211.39" font-size="11.6" font-weight="400" fill="#303d56" text-anchor="middle">and inspect what leaves the service</text><rect x="652" y="144" width="414" height="96" rx="11" fill="#fff7e0" stroke="#b08512" stroke-width="2"/><text x="859" y="181.39" font-size="11.6" font-weight="400" fill="#7a5a0c" text-anchor="middle">Masking coverage  =  items masked ÷ items planted</text><text x="859" y="196.39" font-size="11.6" font-weight="400" fill="#7a5a0c" text-anchor="middle">Reported for each of the four identifier types</text><text x="859" y="211.39" font-size="11.6" font-weight="400" fill="#7a5a0c" text-anchor="middle">Target: 100% before any outside call is made</text><line x1="262" y1="192" x2="276" y2="192" stroke="#7d8da8" stroke-width="1.8" marker-end="url(#ar)"/><line x1="634" y1="192" x2="648" y2="192" stroke="#7d8da8" stroke-width="1.8" marker-end="url(#ar)"/><rect x="14" y="250" width="246" height="96" rx="11" fill="#e4f3f0" stroke="#1a8a7a" stroke-width="2"/><text x="137" y="292.39" font-size="14.5" font-weight="700" fill="#0e544a" text-anchor="middle">Urgency triage</text><text x="137" y="314.39" font-size="11.4" font-weight="400" fill="#0e544a" text-anchor="middle">UrgencyTriage</text><circle cx="32" cy="267" r="11" fill="#1a8a7a"/><text x="32" y="271.2" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><rect x="280" y="250" width="352" height="96" rx="11" fill="#edf0f6" stroke="#5b6b85" stroke-width="2"/><text x="456" y="287.39" font-size="11.6" font-weight="400" fill="#303d56" text-anchor="middle">Hand-label a query set as emergency,</text><text x="456" y="302.39" font-size="11.6" font-weight="400" fill="#303d56" text-anchor="middle">urgent or routine, then compare the</text><text x="456" y="317.39" font-size="11.6" font-weight="400" fill="#303d56" text-anchor="middle">label with the engine output</text><rect x="652" y="250" width="414" height="96" rx="11" fill="#fff7e0" stroke="#b08512" stroke-width="2"/><text x="859" y="287.39" font-size="11.6" font-weight="400" fill="#7a5a0c" text-anchor="middle">Emergency recall  =  emergencies caught ÷ total</text><text x="859" y="302.39" font-size="11.6" font-weight="400" fill="#7a5a0c" text-anchor="middle">False-alarm rate on routine queries</text><text x="859" y="317.39" font-size="11.6" font-weight="400" fill="#7a5a0c" text-anchor="middle">Rule: every emergency must show a helpline</text><line x1="262" y1="298" x2="276" y2="298" stroke="#7d8da8" stroke-width="1.8" marker-end="url(#ar)"/><line x1="634" y1="298" x2="648" y2="298" stroke="#7d8da8" stroke-width="1.8" marker-end="url(#ar)"/><rect x="14" y="356" width="246" height="96" rx="11" fill="#e4f3f0" stroke="#1a8a7a" stroke-width="2"/><text x="137" y="398.39" font-size="14.5" font-weight="700" fill="#0e544a" text-anchor="middle">Case intake</text><text x="137" y="420.39" font-size="11.4" font-weight="400" fill="#0e544a" text-anchor="middle">IntakeAgent</text><circle cx="32" cy="373" r="11" fill="#1a8a7a"/><text x="32" y="377.2" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><rect x="280" y="356" width="352" height="96" rx="11" fill="#edf0f6" stroke="#5b6b85" stroke-width="2"/><text x="456" y="393.39" font-size="11.6" font-weight="400" fill="#303d56" text-anchor="middle">Fixed query set covering the seven legal</text><text x="456" y="408.39" font-size="11.6" font-weight="400" fill="#303d56" text-anchor="middle">domains, run twice — once naming a city</text><text x="456" y="423.39" font-size="11.6" font-weight="400" fill="#303d56" text-anchor="middle">and once without naming one</text><rect x="652" y="356" width="414" height="96" rx="11" fill="#fff7e0" stroke="#b08512" stroke-width="2"/><text x="859" y="393.39" font-size="11.6" font-weight="400" fill="#7a5a0c" text-anchor="middle">Category accuracy  =  correct ÷ total queries</text><text x="859" y="408.39" font-size="11.6" font-weight="400" fill="#7a5a0c" text-anchor="middle">Location detection rate (city or court found)</text><text x="859" y="423.39" font-size="11.6" font-weight="400" fill="#7a5a0c" text-anchor="middle">Fact completeness: amount, date, place</text><line x1="262" y1="404" x2="276" y2="404" stroke="#7d8da8" stroke-width="1.8" marker-end="url(#ar)"/><line x1="634" y1="404" x2="648" y2="404" stroke="#7d8da8" stroke-width="1.8" marker-end="url(#ar)"/><rect x="14" y="462" width="246" height="96" rx="11" fill="#e4f3f0" stroke="#1a8a7a" stroke-width="2"/><text x="137" y="504.39" font-size="14.5" font-weight="700" fill="#0e544a" text-anchor="middle">Grounded retrieval</text><text x="137" y="526.39" font-size="11.4" font-weight="400" fill="#0e544a" text-anchor="middle">ResearchAgent</text><circle cx="32" cy="479" r="11" fill="#1a8a7a"/><text x="32" y="483.2" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><rect x="280" y="462" width="352" height="96" rx="11" fill="#edf0f6" stroke="#5b6b85" stroke-width="2"/><text x="456" y="499.39" font-size="11.6" font-weight="400" fill="#303d56" text-anchor="middle">Run the same query set and compare the</text><text x="456" y="514.39" font-size="11.6" font-weight="400" fill="#303d56" text-anchor="middle">sections returned against an answer key</text><text x="456" y="529.39" font-size="11.6" font-weight="400" fill="#303d56" text-anchor="middle">marked by hand from the Bare Acts</text><rect x="652" y="462" width="414" height="96" rx="11" fill="#fff7e0" stroke="#b08512" stroke-width="2"/><text x="859" y="499.39" font-size="11.6" font-weight="400" fill="#7a5a0c" text-anchor="middle">Correct-Act rate  =  right statute ÷ total queries</text><text x="859" y="514.39" font-size="11.6" font-weight="400" fill="#7a5a0c" text-anchor="middle">Precision of the top three citations</text><text x="859" y="529.39" font-size="11.6" font-weight="400" fill="#7a5a0c" text-anchor="middle">Average number of citations found per query</text><line x1="262" y1="510" x2="276" y2="510" stroke="#7d8da8" stroke-width="1.8" marker-end="url(#ar)"/><line x1="634" y1="510" x2="648" y2="510" stroke="#7d8da8" stroke-width="1.8" marker-end="url(#ar)"/><rect x="14" y="568" width="246" height="80" rx="11" fill="#e4f3f0" stroke="#1a8a7a" stroke-width="2"/><text x="137" y="602.39" font-size="14.5" font-weight="700" fill="#0e544a" text-anchor="middle">Citation checking</text><text x="137" y="624.39" font-size="11.4" font-weight="400" fill="#0e544a" text-anchor="middle">VerifierAgent</text><circle cx="32" cy="585" r="11" fill="#1a8a7a"/><text x="32" y="589.2" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><rect x="280" y="568" width="352" height="80" rx="11" fill="#edf0f6" stroke="#5b6b85" stroke-width="2"/><text x="456" y="604.89" font-size="11.6" font-weight="400" fill="#303d56" text-anchor="middle">Count verified and flagged citations in</text><text x="456" y="619.89" font-size="11.6" font-weight="400" fill="#303d56" text-anchor="middle">every response produced during the run</text><rect x="652" y="568" width="414" height="80" rx="11" fill="#fff7e0" stroke="#b08512" stroke-width="2"/><text x="859" y="604.89" font-size="11.6" font-weight="400" fill="#7a5a0c" text-anchor="middle">Verified rate  =  verified ÷ (verified + flagged)</text><text x="859" y="619.89" font-size="11.6" font-weight="400" fill="#7a5a0c" text-anchor="middle">Count of citations sent for advocate review</text><line x1="262" y1="608" x2="276" y2="608" stroke="#7d8da8" stroke-width="1.8" marker-end="url(#ar)"/><line x1="634" y1="608" x2="648" y2="608" stroke="#7d8da8" stroke-width="1.8" marker-end="url(#ar)"/><rect x="14" y="658" width="246" height="96" rx="11" fill="#fdf0df" stroke="#c07818" stroke-width="2"/><text x="137" y="691.39" font-size="14.5" font-weight="700" fill="#804e10" text-anchor="middle">Reply, notice</text><text x="137" y="709.39" font-size="14.5" font-weight="700" fill="#804e10" text-anchor="middle">and advocate match</text><text x="137" y="731.39" font-size="11.4" font-weight="400" fill="#804e10" text-anchor="middle">Conversational · Drafting · Handoff</text><circle cx="32" cy="675" r="11" fill="#c07818"/><text x="32" y="679.2" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><rect x="280" y="658" width="352" height="96" rx="11" fill="#edf0f6" stroke="#5b6b85" stroke-width="2"/><text x="456" y="695.39" font-size="11.6" font-weight="400" fill="#303d56" text-anchor="middle">Run the whole set with model keys set,</text><text x="456" y="710.39" font-size="11.6" font-weight="400" fill="#303d56" text-anchor="middle">then again with the keys removed, timing</text><text x="456" y="725.39" font-size="11.6" font-weight="400" fill="#303d56" text-anchor="middle">each request from start to finish</text><rect x="652" y="658" width="414" height="96" rx="11" fill="#fff7e0" stroke="#b08512" stroke-width="2"/><text x="859" y="695.39" font-size="11.6" font-weight="400" fill="#7a5a0c" text-anchor="middle">Fallback activation rate (answers without a model)</text><text x="859" y="710.39" font-size="11.6" font-weight="400" fill="#7a5a0c" text-anchor="middle">95th-percentile response time, both modes</text><text x="859" y="725.39" font-size="11.6" font-weight="400" fill="#7a5a0c" text-anchor="middle">Exact-court match rate in the advocate list</text><line x1="262" y1="706" x2="276" y2="706" stroke="#7d8da8" stroke-width="1.8" marker-end="url(#ar)"/><line x1="634" y1="706" x2="648" y2="706" stroke="#7d8da8" stroke-width="1.8" marker-end="url(#ar)"/><rect x="14" y="778" width="1052" height="50" rx="10" fill="#eae7fb" stroke="#5b49b8" stroke-width="2" stroke-dasharray="7 5"/><text x="540" y="805.346" font-size="12.8" font-weight="700" fill="#352a7a" text-anchor="middle">IMPROVEMENT LOOP — read the numbers, then tune the keyword weights, add corpus sections or adjust the prompts, and run exactly the same query set again</text><path d="M900,754 L900,772" fill="none" stroke="#5b49b8" stroke-width="2" marker-end="url(#ar)"/><path d="M160,772 L160,754" fill="none" stroke="#5b49b8" stroke-width="2" marker-end="url(#ar)"/><text x="912" y="762" font-size="11" font-weight="400" fill="#352a7a" text-anchor="start">results</text><text x="172" y="762" font-size="11" font-weight="400" fill="#352a7a" text-anchor="start">changes</text><text x="540" y="854" font-size="12" font-weight="400" fill="#5a6a85" text-anchor="middle" font-style="italic">The same written query set is used every time, so two runs of the system can be compared fairly.</text></svg>