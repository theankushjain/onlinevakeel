<rect x="0" y="0" width="1080" height="985" fill="#ffffff"/><text x="540" y="40" font-size="25" font-weight="700" fill="#17233f" text-anchor="middle">Figure 2 — Interactive Block Diagram</text><text x="540" y="65" font-size="14.5" fill="#5a6a85" text-anchor="middle">Six layers of the platform, from the browser at the top down to the outside services it may call.</text><rect x="14" y="92" width="1052" height="108" rx="14" fill="#fafbfe" stroke="#c9d3e4" stroke-width="1.8" stroke-dasharray="7 5"/><text x="30" y="113" font-size="12.5" font-weight="700" fill="#5a6a85" text-anchor="start">1 · PRESENTATION LAYER — Next.js 14 · TypeScript</text><rect x="30" y="124" width="244.5" height="62" rx="11" fill="#e5effc" stroke="#2f6fb5" stroke-width="2"/><text x="152.25" y="148.16" font-size="13" font-weight="700" fill="#174b80" text-anchor="middle">Landing page  /</text><text x="152.25" y="168.66" font-size="11.2" font-weight="400" fill="#174b80" text-anchor="middle">hero, voice input, quick prompts</text><rect x="288.5" y="124" width="244.5" height="62" rx="11" fill="#e5effc" stroke="#2f6fb5" stroke-width="2"/><text x="410.75" y="148.16" font-size="13" font-weight="700" fill="#174b80" text-anchor="middle">Consultation desk  /consult</text><text x="410.75" y="168.66" font-size="11.2" font-weight="400" fill="#174b80" text-anchor="middle">the chat with the engine</text><rect x="547" y="124" width="244.5" height="62" rx="11" fill="#e5effc" stroke="#2f6fb5" stroke-width="2"/><text x="669.25" y="148.16" font-size="13" font-weight="700" fill="#174b80" text-anchor="middle">Dossier panel</text><text x="669.25" y="168.66" font-size="11.2" font-weight="400" fill="#174b80" text-anchor="middle">Remedies · Notice · Advocates</text><rect x="805.5" y="124" width="244.5" height="62" rx="11" fill="#e5effc" stroke="#2f6fb5" stroke-width="2"/><text x="927.75" y="148.16" font-size="13" font-weight="700" fill="#174b80" text-anchor="middle">Advocate portal</text><text x="927.75" y="168.66" font-size="11.2" font-weight="400" fill="#174b80" text-anchor="middle">leads, accept, reveal contact</text><rect x="14" y="226" width="1052" height="96" rx="14" fill="#fafbfe" stroke="#c9d3e4" stroke-width="1.8" stroke-dasharray="7 5"/><text x="30" y="247" font-size="12.5" font-weight="700" fill="#5a6a85" text-anchor="start">2 · API LAYER — FastAPI on Uvicorn · 13 REST endpoints</text><rect x="30" y="256" width="160" height="56" rx="9" fill="#eae7fb" stroke="#5b49b8" stroke-width="2"/><text x="110" y="270.412" font-size="11.6" font-weight="700" fill="#352a7a" text-anchor="middle">POST</text><text x="110" y="285.512" font-size="11.6" font-weight="700" fill="#352a7a" text-anchor="middle">/api/consult</text><text x="110" y="304.612" font-size="10.6" font-weight="400" fill="#352a7a" text-anchor="middle">the main pipeline</text><rect x="202" y="256" width="160" height="56" rx="9" fill="#eae7fb" stroke="#5b49b8" stroke-width="2"/><text x="282" y="270.412" font-size="11.6" font-weight="700" fill="#352a7a" text-anchor="middle">POST</text><text x="282" y="285.512" font-size="11.6" font-weight="700" fill="#352a7a" text-anchor="middle">/api/draft</text><text x="282" y="304.612" font-size="10.6" font-weight="400" fill="#352a7a" text-anchor="middle">notice on demand</text><rect x="374" y="256" width="160" height="56" rx="9" fill="#eae7fb" stroke="#5b49b8" stroke-width="2"/><text x="454" y="270.412" font-size="11.6" font-weight="700" fill="#352a7a" text-anchor="middle">GET · POST</text><text x="454" y="285.512" font-size="11.6" font-weight="700" fill="#352a7a" text-anchor="middle">/api/advocates</text><text x="454" y="304.612" font-size="10.6" font-weight="400" fill="#352a7a" text-anchor="middle">search · register · login</text><rect x="546" y="256" width="160" height="56" rx="9" fill="#eae7fb" stroke="#5b49b8" stroke-width="2"/><text x="626" y="270.412" font-size="11.6" font-weight="700" fill="#352a7a" text-anchor="middle">POST</text><text x="626" y="285.512" font-size="11.6" font-weight="700" fill="#352a7a" text-anchor="middle">/api/handoff</text><text x="626" y="304.612" font-size="10.6" font-weight="400" fill="#352a7a" text-anchor="middle">book a consultation</text><rect x="718" y="256" width="160" height="56" rx="9" fill="#eae7fb" stroke="#5b49b8" stroke-width="2"/><text x="798" y="270.412" font-size="11.6" font-weight="700" fill="#352a7a" text-anchor="middle">GET · POST</text><text x="798" y="285.512" font-size="11.6" font-weight="700" fill="#352a7a" text-anchor="middle">/api/advocate/leads</text><text x="798" y="304.612" font-size="10.6" font-weight="400" fill="#352a7a" text-anchor="middle">portal inbox + accept</text><rect x="890" y="256" width="160" height="56" rx="9" fill="#eae7fb" stroke="#5b49b8" stroke-width="2"/><text x="970" y="270.412" font-size="11.6" font-weight="700" fill="#352a7a" text-anchor="middle">GET</text><text x="970" y="285.512" font-size="11.6" font-weight="700" fill="#352a7a" text-anchor="middle">/api/districts · /corpus</text><text x="970" y="304.612" font-size="10.6" font-weight="400" fill="#352a7a" text-anchor="middle">reference data · /health</text><rect x="14" y="348" width="1052" height="84" rx="14" fill="#fafbfe" stroke="#c9d3e4" stroke-width="1.8" stroke-dasharray="7 5"/><text x="30" y="369" font-size="12.5" font-weight="700" fill="#5a6a85" text-anchor="start">3 · ORCHESTRATION LAYER</text><rect x="30" y="378" width="1020" height="44" rx="9" fill="#eae7fb" stroke="#5b49b8" stroke-width="2"/><text x="540" y="402.57" font-size="13.5" font-weight="700" fill="#352a7a" text-anchor="middle">OrchestratorAgent — runs the eight steps below in a fixed order and carries the case facts from one chat turn to the next</text><rect x="14" y="458" width="1052" height="200" rx="14" fill="#fafbfe" stroke="#c9d3e4" stroke-width="1.8" stroke-dasharray="7 5"/><text x="30" y="479" font-size="12.5" font-weight="700" fill="#5a6a85" text-anchor="start">4 · AGENT LAYER — eight single-purpose modules</text><g class="hot" data-k="pii"><rect x="30" y="492" width="244.5" height="74" rx="11" fill="#e4f3f0" stroke="#1a8a7a" stroke-width="2"/><text x="161.25" y="516.41" font-size="13" font-weight="700" fill="#0e544a" text-anchor="middle">PII Redactor</text><text x="161.25" y="536.91" font-size="10.9" font-weight="400" fill="#0e544a" text-anchor="middle">masks Aadhaar, PAN,</text><text x="161.25" y="549.91" font-size="10.9" font-weight="400" fill="#0e544a" text-anchor="middle">phone and email</text><circle cx="50" cy="529" r="12.5" fill="#1a8a7a"/><text x="50" y="533.2" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g><g class="hot" data-k="triage"><rect x="288.5" y="492" width="244.5" height="74" rx="11" fill="#e4f3f0" stroke="#1a8a7a" stroke-width="2"/><text x="419.75" y="516.41" font-size="13" font-weight="700" fill="#0e544a" text-anchor="middle">Urgency Triage</text><text x="419.75" y="536.91" font-size="10.9" font-weight="400" fill="#0e544a" text-anchor="middle">emergency · urgent · routine</text><text x="419.75" y="549.91" font-size="10.9" font-weight="400" fill="#0e544a" text-anchor="middle">and the matching helplines</text><circle cx="308.5" cy="529" r="12.5" fill="#1a8a7a"/><text x="308.5" y="533.2" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g><g class="hot" data-k="intake"><rect x="547" y="492" width="244.5" height="74" rx="11" fill="#e4f3f0" stroke="#1a8a7a" stroke-width="2"/><text x="678.25" y="516.41" font-size="13" font-weight="700" fill="#0e544a" text-anchor="middle">Intake Agent</text><text x="678.25" y="536.91" font-size="10.9" font-weight="400" fill="#0e544a" text-anchor="middle">legal category, amount, dates,</text><text x="678.25" y="549.91" font-size="10.9" font-weight="400" fill="#0e544a" text-anchor="middle">city and district court</text><circle cx="567" cy="529" r="12.5" fill="#1a8a7a"/><text x="567" y="533.2" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g><g class="hot" data-k="research"><rect x="805.5" y="492" width="244.5" height="74" rx="11" fill="#e4f3f0" stroke="#1a8a7a" stroke-width="2"/><text x="936.75" y="516.41" font-size="13" font-weight="700" fill="#0e544a" text-anchor="middle">Research · RAG</text><text x="936.75" y="536.91" font-size="10.9" font-weight="400" fill="#0e544a" text-anchor="middle">finds the Bare Act sections</text><text x="936.75" y="549.91" font-size="10.9" font-weight="400" fill="#0e544a" text-anchor="middle">and judgments that fit</text><circle cx="825.5" cy="529" r="12.5" fill="#1a8a7a"/><text x="825.5" y="533.2" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g><g class="hot" data-k="verifier"><rect x="30" y="578" width="244.5" height="74" rx="11" fill="#e4f3f0" stroke="#1a8a7a" stroke-width="2"/><text x="161.25" y="602.41" font-size="13" font-weight="700" fill="#0e544a" text-anchor="middle">Verifier</text><text x="161.25" y="622.91" font-size="10.9" font-weight="400" fill="#0e544a" text-anchor="middle">re-checks every citation</text><text x="161.25" y="635.91" font-size="10.9" font-weight="400" fill="#0e544a" text-anchor="middle">against the stored corpus</text><circle cx="50" cy="615" r="12.5" fill="#1a8a7a"/><text x="50" y="619.2" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text></g><g class="hot" data-k="conv"><rect x="288.5" y="578" width="244.5" height="74" rx="11" fill="#fdf0df" stroke="#c07818" stroke-width="2"/><text x="419.75" y="602.41" font-size="13" font-weight="700" fill="#804e10" text-anchor="middle">Conversational Agent</text><text x="419.75" y="622.91" font-size="10.9" font-weight="400" fill="#804e10" text-anchor="middle">writes the plain-language reply</text><text x="419.75" y="635.91" font-size="10.9" font-weight="400" fill="#804e10" text-anchor="middle">— templates if no model</text><circle cx="308.5" cy="615" r="12.5" fill="#c07818"/><text x="308.5" y="619.2" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><rect x="491.2" y="585" width="33.8" height="17" rx="8.5" fill="#c07818"/><text x="508.1" y="597.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">LLM</text></g><g class="hot" data-k="draft"><rect x="547" y="578" width="244.5" height="74" rx="11" fill="#fdf0df" stroke="#c07818" stroke-width="2"/><text x="678.25" y="602.41" font-size="13" font-weight="700" fill="#804e10" text-anchor="middle">Drafting Agent</text><text x="678.25" y="622.91" font-size="10.9" font-weight="400" fill="#804e10" text-anchor="middle">builds the 15-day notice,</text><text x="678.25" y="635.91" font-size="10.9" font-weight="400" fill="#804e10" text-anchor="middle">updated after every turn</text><circle cx="567" cy="615" r="12.5" fill="#c07818"/><text x="567" y="619.2" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><rect x="749.7" y="585" width="33.8" height="17" rx="8.5" fill="#c07818"/><text x="766.6" y="597.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">LLM</text></g><g class="hot" data-k="handoff"><rect x="805.5" y="578" width="244.5" height="74" rx="11" fill="#e4f3f0" stroke="#1a8a7a" stroke-width="2"/><text x="936.75" y="602.41" font-size="13" font-weight="700" fill="#0e544a" text-anchor="middle">Handoff · Matching</text><text x="936.75" y="622.91" font-size="10.9" font-weight="400" fill="#0e544a" text-anchor="middle">ranks advocates by court,</text><text x="936.75" y="635.91" font-size="10.9" font-weight="400" fill="#0e544a" text-anchor="middle">locality, city and domain</text><circle cx="825.5" cy="615" r="12.5" fill="#1a8a7a"/><text x="825.5" y="619.2" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">8</text></g><rect x="14" y="684" width="1052" height="104" rx="14" fill="#fafbfe" stroke="#c9d3e4" stroke-width="1.8" stroke-dasharray="7 5"/><text x="30" y="705" font-size="12.5" font-weight="700" fill="#5a6a85" text-anchor="start">5 · DATA LAYER — held in the running process; a database is optional</text><rect x="30" y="714" width="244.5" height="62" rx="11" fill="#edf0f6" stroke="#5b6b85" stroke-width="2"/><text x="152.25" y="732.41" font-size="13" font-weight="700" fill="#303d56" text-anchor="middle">Legal corpus</text><text x="152.25" y="752.91" font-size="10.9" font-weight="400" fill="#303d56" text-anchor="middle">verified Bare Act sections</text><text x="152.25" y="765.91" font-size="10.9" font-weight="400" fill="#303d56" text-anchor="middle">and landmark judgments</text><rect x="288.5" y="714" width="244.5" height="62" rx="11" fill="#edf0f6" stroke="#5b6b85" stroke-width="2"/><text x="410.75" y="732.41" font-size="13" font-weight="700" fill="#303d56" text-anchor="middle">District catalog</text><text x="410.75" y="752.91" font-size="10.9" font-weight="400" fill="#303d56" text-anchor="middle">754 judicial districts with</text><text x="410.75" y="765.91" font-size="10.9" font-weight="400" fill="#303d56" text-anchor="middle">their district courts</text><rect x="547" y="714" width="244.5" height="62" rx="11" fill="#edf0f6" stroke="#5b6b85" stroke-width="2"/><text x="669.25" y="732.41" font-size="13" font-weight="700" fill="#303d56" text-anchor="middle">Advocate directory</text><text x="669.25" y="752.91" font-size="10.9" font-weight="400" fill="#303d56" text-anchor="middle">seeded profiles plus newly</text><text x="669.25" y="765.91" font-size="10.9" font-weight="400" fill="#303d56" text-anchor="middle">registered advocates</text><rect x="805.5" y="714" width="244.5" height="62" rx="11" fill="#edf0f6" stroke="#5b6b85" stroke-width="2"/><text x="927.75" y="732.41" font-size="13" font-weight="700" fill="#303d56" text-anchor="middle">Case and lead store</text><text x="927.75" y="752.91" font-size="10.9" font-weight="400" fill="#303d56" text-anchor="middle">case facts, bookings and</text><text x="927.75" y="765.91" font-size="10.9" font-weight="400" fill="#303d56" text-anchor="middle">client reviews</text><rect x="14" y="814" width="1052" height="104" rx="14" fill="#fafbfe" stroke="#c9d3e4" stroke-width="1.8" stroke-dasharray="7 5"/><text x="30" y="835" font-size="12.5" font-weight="700" fill="#5a6a85" text-anchor="start">6 · EXTERNAL SERVICES — every one of them is optional</text><g class="hot" data-k="gemini"><rect x="30" y="844" width="194.4" height="62" rx="11" fill="#fbe8eb" stroke="#b14256" stroke-width="2"/><text x="127.2" y="868.032" font-size="12.6" font-weight="700" fill="#7b2937" text-anchor="middle">Google Gemini</text><text x="127.2" y="888.1320000000001" font-size="11" font-weight="400" fill="#7b2937" text-anchor="middle">reply and notice wording</text></g><g class="hot" data-k="qwen"><rect x="236.4" y="844" width="194.4" height="62" rx="11" fill="#fbe8eb" stroke="#b14256" stroke-width="2"/><text x="333.6" y="868.032" font-size="12.6" font-weight="700" fill="#7b2937" text-anchor="middle">Qwen3-8B · IIT KGP</text><text x="333.6" y="888.1320000000001" font-size="11" font-weight="400" fill="#7b2937" text-anchor="middle">Hindi first, then fallback</text></g><g class="hot" data-k="bge"><rect x="442.8" y="844" width="194.4" height="62" rx="11" fill="#fbe8eb" stroke="#b14256" stroke-width="2"/><text x="540" y="868.032" font-size="12.6" font-weight="700" fill="#7b2937" text-anchor="middle">BGE embeddings</text><text x="540" y="888.1320000000001" font-size="11" font-weight="400" fill="#7b2937" text-anchor="middle">meaning-based ranking</text></g><g class="hot" data-k="supabase"><rect x="649.2" y="844" width="194.4" height="62" rx="11" fill="#fbe8eb" stroke="#b14256" stroke-width="2"/><text x="746.4000000000001" y="868.032" font-size="12.6" font-weight="700" fill="#7b2937" text-anchor="middle">Supabase · pgvector</text><text x="746.4000000000001" y="888.1320000000001" font-size="11" font-weight="400" fill="#7b2937" text-anchor="middle">larger cloud corpus</text></g><g class="hot" data-k="aws"><rect x="855.6" y="844" width="194.4" height="62" rx="11" fill="#fbe8eb" stroke="#b14256" stroke-width="2"/><text x="952.8000000000001" y="868.032" font-size="12.6" font-weight="700" fill="#7b2937" text-anchor="middle">AWS Open Data S3</text><text x="952.8000000000001" y="888.1320000000001" font-size="11" font-weight="400" fill="#7b2937" text-anchor="middle">court judgment PDFs</text></g><line x1="540" y1="202" x2="540" y2="224" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/><line x1="540" y1="324" x2="540" y2="346" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/><line x1="540" y1="434" x2="540" y2="456" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/><line x1="540" y1="660" x2="540" y2="682" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/><line x1="540" y1="790" x2="540" y2="812" stroke="#b2bdd0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arD)" marker-start="url(#arD)"/><rect x="30" y="932" width="15" height="15" rx="4" fill="#e5effc" stroke="#2f6fb5" stroke-width="1.8"/><text x="51" y="944.2" font-size="11.5" font-weight="400" fill="#5a6a85" text-anchor="start">Frontend</text><rect x="125.4" y="932" width="15" height="15" rx="4" fill="#eae7fb" stroke="#5b49b8" stroke-width="1.8"/><text x="146.4" y="944.2" font-size="11.5" font-weight="400" fill="#5a6a85" text-anchor="start">API / orchestration</text><rect x="290.1" y="932" width="15" height="15" rx="4" fill="#e4f3f0" stroke="#1a8a7a" stroke-width="1.8"/><text x="311.1" y="944.2" font-size="11.5" font-weight="400" fill="#5a6a85" text-anchor="start">Rule-based agent</text><rect x="435.90000000000003" y="932" width="15" height="15" rx="4" fill="#fdf0df" stroke="#c07818" stroke-width="1.8"/><text x="456.90000000000003" y="944.2" font-size="11.5" font-weight="400" fill="#5a6a85" text-anchor="start">Language-model step</text><rect x="600.6" y="932" width="15" height="15" rx="4" fill="#edf0f6" stroke="#5b6b85" stroke-width="1.8"/><text x="621.6" y="944.2" font-size="11.5" font-weight="400" fill="#5a6a85" text-anchor="start">Data</text><rect x="670.8000000000001" y="932" width="15" height="15" rx="4" fill="#fbe8eb" stroke="#b14256" stroke-width="1.8"/><text x="691.8000000000001" y="944.2" font-size="11.5" font-weight="400" fill="#5a6a85" text-anchor="start">Outside service</text><text x="540" y="972" font-size="12" font-weight="400" fill="#5a6a85" text-anchor="middle" font-style="italic">Only the two amber blocks call a language model. Every other block is ordinary Python and keeps working with no key, no database and no internet.</text></svg>