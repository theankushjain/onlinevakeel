<rect x="0" y="0" width="1080" height="1290" fill="#ffffff"/><text x="540" y="40" font-size="25" font-weight="700" fill="#17233f" text-anchor="middle">Figure 3 — Overall Application Workflow</text><text x="540" y="65" font-size="14.5" fill="#5a6a85" text-anchor="middle">One citizen question, from the first sentence typed to the advocate picking up the phone</text><rect x="10" y="84" width="206" height="1166" rx="12" fill="#f6f8fc" stroke="#dde4ee" stroke-width="1.5"/><rect x="10" y="84" width="206" height="32" rx="12" fill="#3d5573"/><rect x="10" y="104" width="206" height="12" fill="#3d5573"/><text x="113" y="105" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">CITIZEN</text><rect x="222" y="84" width="206" height="1166" rx="12" fill="#fbfcfe" stroke="#dde4ee" stroke-width="1.5"/><rect x="222" y="84" width="206" height="32" rx="12" fill="#2f6fb5"/><rect x="222" y="104" width="206" height="12" fill="#2f6fb5"/><text x="325" y="105" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">WEB APP</text><rect x="434" y="84" width="206" height="1166" rx="12" fill="#f6f8fc" stroke="#dde4ee" stroke-width="1.5"/><rect x="434" y="84" width="206" height="32" rx="12" fill="#5b49b8"/><rect x="434" y="104" width="206" height="12" fill="#5b49b8"/><text x="537" y="105" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">API · AGENTS</text><rect x="646" y="84" width="206" height="1166" rx="12" fill="#fbfcfe" stroke="#dde4ee" stroke-width="1.5"/><rect x="646" y="84" width="206" height="32" rx="12" fill="#5b6b85"/><rect x="646" y="104" width="206" height="12" fill="#5b6b85"/><text x="749" y="105" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">DATA · MODELS</text><rect x="858" y="84" width="206" height="1166" rx="12" fill="#f6f8fc" stroke="#dde4ee" stroke-width="1.5"/><rect x="858" y="84" width="206" height="32" rx="12" fill="#3d5573"/><rect x="858" y="104" width="206" height="12" fill="#3d5573"/><text x="961" y="105" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">ADVOCATE</text><rect x="20" y="132" width="186" height="54" rx="11" fill="#eceff5" stroke="#3d5573" stroke-width="2"/><text x="113" y="152.882" font-size="12.6" font-weight="700" fill="#1f3550" text-anchor="middle">Citizen types the problem</text><text x="113" y="172.982" font-size="10.7" font-weight="400" fill="#1f3550" text-anchor="middle">in plain words, or speaks it</text><rect x="232" y="200" width="186" height="54" rx="11" fill="#e5effc" stroke="#2f6fb5" stroke-width="2"/><text x="325" y="220.882" font-size="12.6" font-weight="700" fill="#174b80" text-anchor="middle">Web app sends the text</text><text x="325" y="240.982" font-size="10.7" font-weight="400" fill="#174b80" text-anchor="middle">POST /api/consult + history</text><g class="hot" data-k="pii"><rect x="444" y="268" width="186" height="54" rx="11" fill="#e4f3f0" stroke="#1a8a7a" stroke-width="2"/><text x="537" y="288.882" font-size="12.6" font-weight="700" fill="#0e544a" text-anchor="middle">PII Redactor</text><text x="537" y="308.982" font-size="10.7" font-weight="400" fill="#0e544a" text-anchor="middle">Aadhaar · PAN · phone · e-mail</text><circle cx="462" cy="285" r="11" fill="#1a8a7a"/><text x="462" y="289.2" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g><path d="M537,339 L625,376 L537,413 L449,376 z" fill="#fff7e0" stroke="#b08512" stroke-width="2"/><text x="537" y="373" font-size="13" font-weight="700" fill="#7a5a0c" text-anchor="middle">Step 2 — triage</text><text x="537" y="388" font-size="13" font-weight="700" fill="#7a5a0c" text-anchor="middle">Emergency words?</text><rect x="656" y="349" width="186" height="54" rx="11" fill="#fbe8eb" stroke="#b14256" stroke-width="2"/><text x="749" y="369.882" font-size="12.6" font-weight="700" fill="#7b2937" text-anchor="middle">Helplines attached</text><text x="749" y="389.982" font-size="10.7" font-weight="400" fill="#7b2937" text-anchor="middle">112 · 15100 · 1930 · 1091</text><g class="hot" data-k="intake"><rect x="444" y="430" width="186" height="54" rx="11" fill="#e4f3f0" stroke="#1a8a7a" stroke-width="2"/><text x="537" y="450.882" font-size="12.6" font-weight="700" fill="#0e544a" text-anchor="middle">Intake Agent</text><text x="537" y="470.982" font-size="10.7" font-weight="400" fill="#0e544a" text-anchor="middle">category · amount · dates · city</text><circle cx="462" cy="447" r="11" fill="#1a8a7a"/><text x="462" y="451.2" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g><path d="M537,501 L625,538 L537,575 L449,538 z" fill="#fff7e0" stroke="#b08512" stroke-width="2"/><text x="537" y="535" font-size="13" font-weight="700" fill="#7a5a0c" text-anchor="middle">City or court</text><text x="537" y="550" font-size="13" font-weight="700" fill="#7a5a0c" text-anchor="middle">already known?</text><rect x="20" y="511" width="186" height="54" rx="11" fill="#eceff5" stroke="#3d5573" stroke-width="2"/><text x="113" y="531.882" font-size="12.6" font-weight="700" fill="#1f3550" text-anchor="middle">Asked once for the city</text><text x="113" y="551.982" font-size="10.7" font-weight="400" fill="#1f3550" text-anchor="middle">or nearest district court</text><g class="hot" data-k="research"><rect x="444" y="592" width="186" height="54" rx="11" fill="#e4f3f0" stroke="#1a8a7a" stroke-width="2"/><text x="537" y="612.882" font-size="12.6" font-weight="700" fill="#0e544a" text-anchor="middle">Research · RAG</text><text x="537" y="632.982" font-size="10.7" font-weight="400" fill="#0e544a" text-anchor="middle">picks the matching sections</text><circle cx="462" cy="609" r="11" fill="#1a8a7a"/><text x="462" y="613.2" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g><rect x="656" y="592" width="186" height="54" rx="11" fill="#edf0f6" stroke="#5b6b85" stroke-width="2"/><text x="749" y="612.882" font-size="12.6" font-weight="700" fill="#303d56" text-anchor="middle">Legal corpus</text><text x="749" y="632.982" font-size="10.7" font-weight="400" fill="#303d56" text-anchor="middle">Bare Acts · judgments · cloud</text><g class="hot" data-k="verifier"><rect x="444" y="666" width="186" height="54" rx="11" fill="#e4f3f0" stroke="#1a8a7a" stroke-width="2"/><text x="537" y="686.882" font-size="12.6" font-weight="700" fill="#0e544a" text-anchor="middle">Verifier</text><text x="537" y="706.982" font-size="10.7" font-weight="400" fill="#0e544a" text-anchor="middle">re-checks every citation</text><circle cx="462" cy="683" r="11" fill="#1a8a7a"/><text x="462" y="687.2" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text></g><g class="hot" data-k="conv"><rect x="444" y="740" width="186" height="54" rx="11" fill="#fdf0df" stroke="#c07818" stroke-width="2"/><text x="537" y="760.5619999999999" font-size="11.6" font-weight="700" fill="#804e10" text-anchor="middle">Conversational Agent</text><text x="537" y="779.6619999999999" font-size="10.7" font-weight="400" fill="#804e10" text-anchor="middle">Qwen → Gemini → templates</text><circle cx="462" cy="757" r="11" fill="#c07818"/><text x="462" y="761.2" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text></g><rect x="656" y="740" width="186" height="54" rx="11" fill="#fbe8eb" stroke="#b14256" stroke-width="2"/><text x="749" y="760.882" font-size="12.6" font-weight="700" fill="#7b2937" text-anchor="middle">Language models</text><text x="749" y="780.982" font-size="10.7" font-weight="400" fill="#7b2937" text-anchor="middle">optional — all three</text><g class="hot" data-k="draft"><rect x="444" y="814" width="186" height="54" rx="11" fill="#fdf0df" stroke="#c07818" stroke-width="2"/><text x="537" y="834.882" font-size="12.6" font-weight="700" fill="#804e10" text-anchor="middle">Drafting Agent</text><text x="537" y="854.982" font-size="10.7" font-weight="400" fill="#804e10" text-anchor="middle">15-day notice, updated each turn</text><circle cx="462" cy="831" r="11" fill="#c07818"/><text x="462" y="835.2" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">7</text></g><g class="hot" data-k="handoff"><rect x="444" y="888" width="186" height="54" rx="11" fill="#e4f3f0" stroke="#1a8a7a" stroke-width="2"/><text x="537" y="908.882" font-size="12.6" font-weight="700" fill="#0e544a" text-anchor="middle">Handoff · Matching</text><text x="537" y="928.982" font-size="10.7" font-weight="400" fill="#0e544a" text-anchor="middle">ranks advocates by court, area</text><circle cx="462" cy="905" r="11" fill="#1a8a7a"/><text x="462" y="909.2" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">8</text></g><rect x="656" y="888" width="186" height="54" rx="11" fill="#edf0f6" stroke="#5b6b85" stroke-width="2"/><text x="749" y="908.882" font-size="12.6" font-weight="700" fill="#303d56" text-anchor="middle">Advocate directory</text><text x="749" y="928.982" font-size="10.7" font-weight="400" fill="#303d56" text-anchor="middle">754 districts · practice areas</text><rect x="232" y="962" width="186" height="54" rx="11" fill="#e5effc" stroke="#2f6fb5" stroke-width="2"/><text x="325" y="982.882" font-size="12.6" font-weight="700" fill="#174b80" text-anchor="middle">Dossier panel updates</text><text x="325" y="1002.982" font-size="10.7" font-weight="400" fill="#174b80" text-anchor="middle">Remedies · Notice · Advocates</text><rect x="20" y="1036" width="186" height="54" rx="11" fill="#eceff5" stroke="#3d5573" stroke-width="2"/><text x="113" y="1056.882" font-size="12.6" font-weight="700" fill="#1f3550" text-anchor="middle">Citizen books a consultation</text><text x="113" y="1076.982" font-size="10.7" font-weight="400" fill="#1f3550" text-anchor="middle">mode · time slot · notice attached</text><rect x="868" y="1036" width="186" height="54" rx="11" fill="#eceff5" stroke="#3d5573" stroke-width="2"/><text x="961" y="1056.882" font-size="12.6" font-weight="700" fill="#1f3550" text-anchor="middle">Masked lead appears</text><text x="961" y="1076.982" font-size="10.7" font-weight="400" fill="#1f3550" text-anchor="middle">name and phone are hidden</text><rect x="868" y="1110" width="186" height="54" rx="11" fill="#eceff5" stroke="#3d5573" stroke-width="2"/><text x="961" y="1130.882" font-size="12.6" font-weight="700" fill="#1f3550" text-anchor="middle">Advocate accepts</text><text x="961" y="1150.982" font-size="10.7" font-weight="400" fill="#1f3550" text-anchor="middle">phone revealed → call / video</text><rect x="20" y="1184" width="186" height="54" rx="11" fill="#eceff5" stroke="#3d5573" stroke-width="2"/><text x="113" y="1204.882" font-size="12.6" font-weight="700" fill="#1f3550" text-anchor="middle">Citizen rates the advocate</text><text x="113" y="1224.982" font-size="10.7" font-weight="400" fill="#1f3550" text-anchor="middle">after the consultation</text><path d="M113,186 L113,193 L325,193 L325,200" fill="none" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><path d="M325,254 L325,261 L537,261 L537,268" fill="none" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><line x1="537" y1="322" x2="537" y2="339" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><line x1="626" y1="376" x2="652" y2="376" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><text x="638" y="368" font-size="10.5" font-weight="400" fill="#5a6a85" text-anchor="middle">yes</text><line x1="537" y1="413" x2="537" y2="430" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><text x="549" y="426" font-size="10.5" font-weight="400" fill="#5a6a85" text-anchor="start">always continues</text><line x1="537" y1="484" x2="537" y2="501" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><line x1="448" y1="538" x2="210" y2="538" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><text x="325" y="530" font-size="10.5" font-weight="400" fill="#5a6a85" text-anchor="middle">no — the reply asks for it once</text><line x1="537" y1="575" x2="537" y2="592" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><text x="549" y="588" font-size="10.5" font-weight="400" fill="#5a6a85" text-anchor="start">yes</text><line x1="632" y1="619" x2="652" y2="619" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/><line x1="537" y1="646" x2="537" y2="666" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><line x1="537" y1="720" x2="537" y2="740" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><line x1="632" y1="767" x2="652" y2="767" stroke="#b2bdd0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arD)" marker-start="url(#arD)"/><line x1="537" y1="794" x2="537" y2="814" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><line x1="537" y1="868" x2="537" y2="888" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><line x1="632" y1="915" x2="652" y2="915" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/><path d="M537,942 L537,952 L325,952 L325,962" fill="none" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><path d="M325,1016 L325,1026 L113,1026 L113,1036" fill="none" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><line x1="208" y1="1063" x2="864" y2="1063" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><text x="537" y="1055" font-size="10.8" font-weight="400" fill="#5a6a85" text-anchor="middle">POST /api/handoff — booking details and the attached notice</text><line x1="961" y1="1090" x2="961" y2="1110" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><path d="M961,1164 L961,1174 L113,1174 L113,1184" fill="none" stroke="#7d8da8" stroke-width="2" marker-end="url(#ar)"/><text x="537" y="1168" font-size="10.8" font-weight="400" fill="#5a6a85" text-anchor="middle">consultation takes place</text><text x="540" y="1276" font-size="11.8" font-weight="400" fill="#5a6a85" text-anchor="middle" font-style="italic">Steps 1 to 8 all run inside the single /api/consult request. The two amber steps use a language model when a key is set; otherwise the built-in legal templates are used.</text></svg>